# Data warehouse connection profile.
#
# The Snowflake profiles (snowflake_prod / snowflake_reporting / odbc) were
# removed in the 2026-Q2 Snowflake -> BigQuery migration along with their
# plaintext credentials. The pipeline now talks to BigQuery exclusively via
# the google-cloud-bigquery client (see etl/warehouse/bigquery_client.py).
#
# These values mirror configs/pipeline.env and are here for reference; the
# Python code reads pipeline.env / environment variables, not this file.

[bigquery]
project=albertsons-retail-analytics
dataset=store_ops
location=US
# Credentials: Application Default Credentials (GOOGLE_APPLICATION_CREDENTIALS
# on GCE/Cloud Run, or the attached service account on Composer).
